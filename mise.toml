[tools]
node = "latest"
# pnpm as the package manager, installed via mise so its version is pinned in
# mise.lock. Node 25 dropped the bundled corepack, so there is no
# `corepack enable` step — mise provisions pnpm directly.
"npm:pnpm" = "latest"

[settings]
# Required for the task runner features used below.
experimental = true

[env]
# node_modules/.bin first so bare `astro` / `biome` in the tasks below resolve
# to the project's pinned devDependency versions.
_.path = ['{{config_root}}/node_modules/.bin']

# ----------------------------------------------------------------- workflow

[tasks.pnpm-install]
description = 'Install dependencies with pnpm'
run = 'pnpm install'
sources = ['package.json', 'pnpm-lock.yaml', 'mise.toml']
outputs = ['node_modules/.pnpm/lock.yaml']

[tasks.dev]
description = 'Start the Astro dev server'
depends = ['pnpm-install']
run = 'astro dev'

[tasks.build]
description = 'Build the static site to dist/'
depends = ['pnpm-install']
run = 'astro build'

[tasks.preview]
description = 'Serve the built site from dist/ locally'
depends = ['build']
run = 'astro preview'

# -------------------------------------------------------------------- check

[tasks.check]
description = 'Run every check (Biome, astro check, Prettier, ASCII)'
# Wildcard: every check:* subtask is part of the gate, so adding one wires it
# in automatically.
depends = ['check:*']
# Final marker so callers (and agents) get an unambiguous success line.
run = "echo 'mise check: ALL CHECKS PASSED'"

[tasks."check:biome"]
description = 'Lint + format-check with Biome (no writes)'
depends = ['pnpm-install']
run = 'biome check'

[tasks."check:astro"]
description = 'Type-check .astro and TypeScript with astro check'
depends = ['pnpm-install']
# --minimumFailingSeverity hint: exit non-zero on hints too (default is
# 'error'), so deprecation hints like ts(6385) fail the gate instead of
# scrolling past as benign noise.
run = 'astro check --minimumFailingSeverity hint'

[tasks."check:ascii"]
description = 'Fail if any content file contains non-ASCII characters'
# macOS ships BSD grep, which has no -P, so `\x00-\x7F` is unavailable.
# Under LC_ALL=C grep compares bytes
# (0x20-0x7E) is a violation.
run = '''
pattern=$(printf '[^\t -~]')
status=0
# on the exit 1 that means "nothing found".
LC_ALL=C grep -rn "$pattern" src/content || status=$?
if [ "$status" -eq 0 ]; then
  echo 'check:ascii: FAILED - replace the non-ASCII characters listed above' >&2
  exit 1
elif [ "$status" -ne 1 ]; then
  echo "check:ascii: ERROR - grep exited $status" >&2
  exit "$status"
fi
echo 'check:ascii: content is ASCII-only'
'''

[tasks."check:md"]
description = 'Format-check content Markdown (frontmatter + body) with Prettier'
depends = ['pnpm-install']
run = "prettier --check 'src/content/**/*.md'"

# ---------------------------------------------------------------------- fix

[tasks.fix]
description = 'Apply every auto-fix (Biome + Prettier Markdown)'
depends = ['fix:*']
run = "echo 'mise fix: done'"

[tasks."fix:biome"]
description = 'Format and apply safe Biome fixes (writes files)'
depends = ['pnpm-install']
run = 'biome check --write'

[tasks."fix:md"]
description = 'Format content Markdown (frontmatter + body) with Prettier (writes files)'
depends = ['pnpm-install']
run = "prettier --write 'src/content/**/*.md'"
